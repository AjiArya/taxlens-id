name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject build ID
        run: |
          BUILD_ID="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed -i "s|name=\"build-id\" content=\"__BUILD_ID__\"|name=\"build-id\" content=\"${BUILD_ID}\"|" index.html

      - name: Publish site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-deploy
          git rm -rf --cached .
          git add index.html .nojekyll assets
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push --force origin pages-deploy:gh-pages
